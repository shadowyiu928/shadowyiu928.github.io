{% include base_path %}

<!-- start custom head snippets -->

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">

<!-- Support for Academicons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

<!-- Support for Font Awesome (blocking load avoids intermittent empty icon boxes) -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css">

<!-- Site tab icon from author avatar (?v= busts old graduation-hat cache) -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=avatar2"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=avatar2" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v=avatar2" sizes="192x192"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=avatar2"/>
<link rel="shortcut icon" href="{{ base_path }}/favicon.ico?v=avatar2"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- end custom head snippets -->
